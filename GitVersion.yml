mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .470/.480/.500 - see
# crawler.build.jobs.yml), so this repo's own version no longer needs to track CluedIn. Reset to
# 1.0. next-version alone isn't enough - GitVersion still sees the old 4.x tags in history and
# treats them as dominant - so commits-before skips everything up to and including the highest
# pre-existing tag (4.6.2, 2026-06-17T17:20:26+10:00).
next-version: 1.0
ignore:
  commits-before: 2026-06-18T00:00:00
branches:
  hotfix:
    tag: useBranchName
  pull-request:
    tag: pr
    increment: None
  master:
    mode: ContinuousDelivery
  ama:
    increment: None
    tracks-release-branches: false
    regex: ^ama[/-]
    is-release-branch: false
    mode: ContinuousDeployment
    track-merge-target: false
    tag: ama
    pre-release-weight: 30000
    prevent-increment-of-merged-branch-version: true
    is-mainline: false
    source-branches:
    - main
    - develop
  develop:
    tag: alpha

